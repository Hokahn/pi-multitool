<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1318;color:#e8edf2;font:16px system-ui,sans-serif;padding:16px}
form{background:#171d24;border:1px solid #26303b;border-radius:14px;padding:22px;width:100%;max-width:340px}
h1{font-size:20px;margin:0 0 14px}
input,button{width:100%;font:inherit;padding:11px;border-radius:8px;border:1px solid #26303b;background:#202833;color:#e8edf2;margin-top:8px}
button{background:#3d8bff;border-color:#3d8bff;cursor:pointer}
p{color:#ff7b7b;min-height:1.2em;margin:8px 0 0}
</style></head>
<body><form onsubmit="go(event)">
<h1>Pi Multitool</h1>
<input type="password" id="pw" placeholder="Passwort" autofocus autocomplete="current-password">
<button>Anmelden</button><p id="e"></p></form>
<script>
async function go(ev){ev.preventDefault();
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
 if(r.ok) location.href='/'; else document.getElementById('e').textContent='Falsches Passwort';}
</script></body></html>
